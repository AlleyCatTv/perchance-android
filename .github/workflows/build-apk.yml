# ---------------------------------------------------------------------------
# BUILD PERCHANCE APK - GitHub Actions workflow
#
# Paste ALL of this text into .github/workflows/build-apk.yml, replacing
# everything that is there now, then commit. The app download link is already
# built in, so there is nothing else to edit.
# ---------------------------------------------------------------------------
name: Build Perchance APK

# Builds an installable APK on GitHub's runners. Nothing needs to be installed
# on your own machine.
#
# Quick start: create an empty repository, add this file at
# .github/workflows/build-apk.yml, and commit. That starts a build.
#
# The app source is downloaded fresh from the link in PROJECT_ZIP_URL on every
# run (falling back to the copy committed in this repo if that download fails),
# so a run can never use a stale copy.
#
# If the build fails, the whole build output is saved to build-logs/latest.txt
# in this same repository, so the error can be read without opening the log on
# a phone.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Used only when this repo does not already contain the app source (no
  # gradlew). Set a repository variable named PROJECT_ZIP_URL, or paste a URL
  # straight in here. Ignored once the source is committed in the repo.
  # Accepts: the project zip, a repository archive (.zip/.tar.gz, optionally
  # with a query string), or a git clone URL (https://github.com/you/repo.git).
  PROJECT_ZIP_URL: "https://user.uploads.dev/file/423a3f1a448a47ba255bddacb70b20b7.zip"

jobs:
  build:
    name: Assemble installable APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found on this runner at $SDK"
            exit 1
          fi
          if ! command -v sdkmanager > /dev/null 2>&1; then
            for candidate in "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/bin" "$SDK/tools/bin"; do
              if [ -x "$candidate/sdkmanager" ]; then
                PATH="$candidate:$PATH"
                break
              fi
            done
          fi
          if ! command -v sdkmanager > /dev/null 2>&1; then
            echo "Installing the Android command-line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          fi
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null || true
          sdkmanager --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --sdk_root="$SDK" --list_installed | head -n 40 || true

      - name: Get the app source
        run: |
          URL="$PROJECT_ZIP_URL"
          if [ -z "$URL" ]; then
            if [ ! -f ./gradlew ]; then
              echo "::error::This repository has no app source and PROJECT_ZIP_URL is empty."
              exit 1
            fi
            echo "No download link set - using the copy of the app source already in this repository."
          else
            SRC=/tmp/perchance-src
            rm -rf "$SRC"
            mkdir -p "$SRC"
            OK=1
            case "$URL" in
              *.git|git@*|ssh://*|git+*)
                echo "Cloning $URL"
                git clone --depth 1 "${URL#git+}" "$SRC" || OK=0 ;;
              *)
                echo "Downloading $URL"
                if curl -fsSL -o /tmp/perchance-download "$URL"; then
                  if tar -tf /tmp/perchance-download > /dev/null 2>&1; then
                    tar -xaf /tmp/perchance-download -C "$SRC"
                  else
                    unzip -q -o /tmp/perchance-download -d "$SRC"
                  fi
                else
                  OK=0
                fi ;;
            esac
            # A repository archive (github.com/<user>/<repo>/archive/refs/heads/main.zip,
            # codeload, GitLab/Bitbucket download links) wraps everything in one
            # top-level "<repo>-<branch>/" folder - flatten it.
            if [ "$OK" = "1" ] && [ ! -f "$SRC/gradlew" ]; then
              INNER=""
              for d in "$SRC"/*/; do INNER="${d%/}"; break; done
              if [ -n "$INNER" ] && [ -f "$INNER/gradlew" ]; then
                shopt -s dotglob
                mv "$INNER"/* "$SRC"/
                rmdir "$INNER"
                shopt -u dotglob
              fi
            fi
            if [ "$OK" != "1" ] || [ ! -f "$SRC/gradlew" ]; then
              if [ ! -f ./gradlew ]; then
                echo "::error::Could not get the app source from $URL."
                ls -la "$SRC"
                exit 1
              fi
              echo "::warning::Could not download the app source - keeping the copy that is already in this repository."
            else
              # Never replace a signing key that already lives in this repo.
              if [ -f signing/perchance.jks ]; then rm -rf "$SRC/signing"; fi
              # Keep this workflow file instead of the copy shipped with the source.
              mkdir -p "$SRC/.github/workflows"
              cp .github/workflows/build-apk.yml "$SRC/.github/workflows/build-apk.yml"
              rm -rf "$SRC/.git"
              shopt -s dotglob
              cp -R "$SRC"/. .
              shopt -u dotglob
            fi
          fi
          chmod +x ./gradlew
          ls -la
          chmod +x ./gradlew
          ls -la

      - name: Create a signing key (once)
        run: |
          KS=signing/perchance.jks
          if [ ! -f "$KS" ]; then
            mkdir -p signing
            keytool -genkeypair -keystore "$KS" -storetype JKS -alias perchance \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass perchance-key -keypass perchance-key \
              -dname "CN=Perchance, O=Perchance, C=US"
          fi
          {
            echo "PERCHANCE_KEYSTORE=$PWD/$KS"
            echo "PERCHANCE_KEYSTORE_PASSWORD=perchance-key"
            echo "PERCHANCE_KEY_ALIAS=perchance"
            echo "PERCHANCE_KEY_PASSWORD=perchance-key"
          } >> "$GITHUB_ENV"

      - name: Keep the source and the key in this repo
        run: |
          git config user.name "perchance-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add -f signing/perchance.jks
          if ! git diff --cached --quiet; then
            git commit -m "Sync app source and signing key [skip ci]"
            git push
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          set +e
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace --console=plain > /tmp/build.log 2>&1
          STATUS=$?
          set -e
          echo "BUILD_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "gradle exit status: $STATUS"
          echo "----- errors and explanation from the build output -----"
          grep -n -E "^(e: |error: |FAILURE|\* What went wrong|\* Where|\* Try|Caused by:|> )" /tmp/build.log 2>/dev/null | head -n 60 || true
          echo "----- last 40 lines -----"
          tail -n 40 /tmp/build.log || true
          echo "--------------------------------------------------------"

      - name: Save the build log in this repo
        if: always()
        run: |
          mkdir -p build-logs
          {
            echo "Build Perchance APK - run ${GITHUB_RUN_NUMBER} (${GITHUB_RUN_ID})"
            echo "commit: ${GITHUB_SHA}"
            echo "when: $(date -u +%FT%TZ)"
            echo "gradle exit status: ${BUILD_STATUS:-unknown}"
            echo "java: $(java -version 2>&1 | head -n 1)"
            echo "runner: ${ImageOS:-unknown}"
            echo
            echo "===== wrapper ====="
            cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
            echo
            echo "===== error lines ====="
            grep -n -E "^(e: |error: |FAILURE|\\* What went wrong|\\* Where|\\* Try|Caused by:|> )" /tmp/build.log 2>/dev/null | head -n 200 || true
            echo
            echo "===== last 400 lines of the build output ====="
            tail -n 400 /tmp/build.log 2>/dev/null || true
          } > build-logs/latest.txt
          cp build-logs/latest.txt "build-logs/run-${GITHUB_RUN_NUMBER}.txt" 2>/dev/null || true
          wc -l build-logs/latest.txt
          git config user.name "perchance-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f build-logs
          if ! git diff --cached --quiet; then
            git commit -m "Record the build log for run ${GITHUB_RUN_NUMBER} [skip ci]"
            git push || true
          fi

      - name: Report the result
        if: always()
        run: |
          if [ "${BUILD_STATUS:-1}" = "0" ]; then
            echo "::notice::The APKs built successfully."
          else
            echo "::error::Gradle failed with exit status ${BUILD_STATUS:-unknown}. The complete build output was saved to build-logs/latest.txt in this repository."
            exit 1
          fi

      - name: Collect APKs
        if: env.BUILD_STATUS == '0'
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' | while read -r f; do
            case "$f" in
              *debug*) cp "$f" artifacts/Perchance-debug.apk ;;
              *release*) cp "$f" artifacts/Perchance.apk ;;
            esac
          done
          ls -lh artifacts

      - name: Upload APKs as build artifacts
        if: env.BUILD_STATUS == '0'
        uses: actions/upload-artifact@v4
        with:
          name: perchance-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish an installable APK in Releases
        if: env.BUILD_STATUS == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber
          else
            gh release create "$TAG" \
              --title "Perchance app build ${{ github.run_number }}" \
              --notes "Tap Perchance.apk to download it, then open it on your phone to install. Perchance-debug.apk is the same app with WebView debugging enabled." \
              artifacts/*.apk
          fi
